spring:
  application:
    name: moing-moing-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moing_moing}
    username: ${DB_USERNAME:moing_moing}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  initial-admin:
    login: ${INITIAL_ADMIN_LOGIN:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  coupon:
    qr-token-encryption-key: ${QR_TOKEN_ENCRYPTION_KEY:}
